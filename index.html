<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swatch This</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fef3c7, #f9a8d4, #93c5fd);
      color: #111827;
    }

    main {
      width: min(90vw, 32rem);
      padding: 3rem 2rem;
      text-align: center;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 1rem 2.5rem rgba(17, 24, 39, 0.18);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    p {
      margin: 0 0 2rem;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 0.9rem 1.5rem;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #1f2937;
    }

    a:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Swatch This</h1>
    <p>Discover the color naming game and download Swatch This on the App Store.</p>
    <a href="https://apps.apple.com/us/app/swatch-this/id1522807853">Download on the App Store</a>
  </main>
</body>
</html>
